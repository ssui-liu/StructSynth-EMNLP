[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structsynth"
version = "0.2.0"
description = "Evidence-grounded graph induction and graph-planned tabular synthesis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<3",
  "pandas>=1.3,<3",
  "networkx>=2.8,<4",
  "scipy>=1.9,<2",
  "scikit-learn>=1.0,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
evaluation = ["xgboost>=1.7,<4"]
dev = ["pytest>=7,<10", "ruff>=0.9", "build>=1"]

[project.scripts]
structsynth = "structsynth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

